<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Tecnologia</title>
    <link rel="stylesheet" type="text/css" href="../assets/css/HeaderBaseImgBotoes.css">
    <link rel="icon" href="https://svriglobal.com/wp-content/uploads/2021/04/logo-science-valley-favicon.png"
        type="image/x-icon">
    <style>
        body {
        background-color: #cdcecd;
        background-image: linear-gradient(to right, #cdcecd 0%, #ffffff 30%, #ffffff 70%, #cdcecd 100%);
        background-image: url("../assets/img/Fundo.webp");
        background-size: auto;
        background-position: center;
        }
        a { text-decoration: none; }

        .card {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 1100px;
            max-width: 95vw;
            text-align: center;
            overflow: hidden;
        }

        /* Imagem Tecnologia.png diminuída */
        .card img#tech {
            width: 200px;       /* ajuste esse valor ao tamanho desejado */
            max-width: 100%;
            height: auto;
            object-fit: cover;
            margin-top: 20px;
        }

        .card h2 {
            font-size: 25px;    
        }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            padding: 20px;
        }

        /* Container que agrupa os dois vídeos lado a lado */
        .videos-wrapper {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            margin: 20px auto 30px auto;
            padding: 0 20px;
        }

        /* Bloco individual de cada vídeo (título + player) */
        .video-bloco {
            flex: 1 1 480px;
            max-width: 560px;
        }

        .video-bloco h2 {
            font-size: 22px;
        }

        /* Estilo do vídeo (tamanho aumentado) */
        .video-seguranca {
            width: 100%;
            max-width: 560px;
            aspect-ratio: 16 / 9;
            display: block;
            border-radius: 8px;
            border: none;
        }
    </style>
</head>

<body>
    <header>
        <div class="menu_pagina">
            <div class="img_menu">
                <a href="https://svriglobal.com/">
                    <img class="logo" src="../assets/img/logo-science-valley.png" alt="Logo Science">
                </a>
            </div>
            <nav>
                <ul class="menu">
                    <li><a href="../Central_Treinamentos.html">Painel de Treinamentos</a></li>
                </ul>
            </nav>
            <h2>Menu Tecnologia</h2>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <div class="imgtec">
                <img class="imgtec" src="../assets/img/Tecnologia.png" id="tech">
            </div>
            
            <div class="Botoes_grid">

                <div class="Botoes">
                    <button id="BotaoAcessos" class="botaovideo">Acessos</button>
                </div>

                <div class="Botoes">
                    <button id="BotaoPlataformas" class="botaovideo">Plataformas</button>
                </div>

                <div class="Botoes">
                    <button id="BotaoPolíticas" class="botaovideo"
                            onclick="window.location.href='https://netorgft4487772.sharepoint.com/:f:/r/sites/ScienceValley/Documentos%20Compartilhados/Integra%C3%A7%C3%A3o%20Science/INTEGRA%C3%87%C3%83O%20POL%C3%8DTICAS%20E%20DIRETRIZES/Pol%C3%ADticas%20TI?csf=1&web=1&e=vaupRv'">
                        Políticas
                    </button>
                </div>
            </div>

            <!-- Área com os dois vídeos lado a lado -->
            <div class="videos-wrapper">

                <!-- Vídeo 1: Políticas de Segurança (original) -->
                <div class="video-bloco">
                    <h2>Video: Políticas de Segurança da Science Valley</h2>
                    <video class="video-seguranca" controls>
                        <source src="../assets/Explainer_Video.mp4" type="video/mp4">
                        Seu navegador não suporta a exibição de vídeos.
                    </video>
                </div>

                <!-- Vídeo 2: novo vídeo (duplicado) -->
                 <div class="video-bloco">
                    <h2>Video: Políticas Institucional Uso de IA</h2>
                    <video class="video-seguranca" controls>
                        <source src="../assets/Política_de_IA_da_Science.mp4" type="video/mp4">
                        Seu navegador não suporta a exibição de vídeos.
                    </video>
                </div>

            </div>

        </div>
    </div>
    <script>
        document.getElementById("BotaoAcessos").onclick = function () {
            window.location.href = "../Tecnologia/Acessos/Aulas.html"
        };

        document.getElementById("BotaoPlataformas").onclick = function () {
            window.location.href = "../Tecnologia/Plataformas/Menu_Plataformas.html"
        };


    </script>
</body>

</html>
